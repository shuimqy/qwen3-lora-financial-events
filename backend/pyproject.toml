[project]
name = "financial-event-backend"
version = "0.1.0"
description = "LangGraph intent routing backend for the financial event assistant"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi>=0.115,<0.116",
  "uvicorn>=0.34,<0.35",
  "pydantic-settings>=2.8,<3",
  "httpx>=0.28,<0.29",
  "langgraph>=1.0,<2",
]

[project.scripts]
financial-backend = "financial_backend.main:main"

[dependency-groups]
dev = ["pytest>=8.3,<9", "ruff>=0.11,<0.12"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/financial_backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".cache", ".python", ".python-bin", ".venv", "run"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
