[project]
name = "financial-event-model-service"
version = "0.1.0"
description = "Independent local inference service for Qwen3 financial event extraction"
requires-python = ">=3.11,<3.12"
dependencies = [
  "torch==2.5.0",
  "transformers==4.51.3",
  "peft==0.15.2",
  "accelerate==1.6.0",
  "huggingface-hub==0.36.2",
  "tokenizers==0.21.4",
  "safetensors==0.8.0",
  "numpy==1.26.4",
  "fastapi>=0.115,<0.116",
  "uvicorn>=0.34,<0.35",
  "pydantic-settings>=2.8,<3",
]

[project.scripts]
model-service = "model_service.main:main"

[dependency-groups]
dev = ["pytest>=8.3,<9", "httpx>=0.28,<0.29", "ruff>=0.11,<0.12"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/model_service"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".cache", ".python", ".python-bin", ".venv", "run"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
