[project]
name = "financial-assistant-frontend"
version = "0.1.0"
description = "Minimal chat UI and local static server"
requires-python = ">=3.11,<3.12"
dependencies = []

[project.scripts]
financial-frontend = "financial_frontend.server:main"

[dependency-groups]
dev = ["pytest>=8.3,<9", "playwright>=1.50,<2"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/financial_frontend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
