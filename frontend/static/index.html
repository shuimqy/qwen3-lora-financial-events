<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <meta name="description" content="金融助手：日常对话与金融公告事件抽取。">
    <title>金融助手</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%23262626'/%3E%3Cpath d='M11 13h18v11H18l-6 5v-5h-1z' fill='none' stroke='%23fff' stroke-width='2' stroke-linejoin='round'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="/style.css">
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <div class="app">
      <header class="header">
        <a class="brand" href="/" aria-label="金融助手首页">
          <svg class="brand-mark" viewBox="0 0 32 32" fill="none" aria-hidden="true"><rect width="32" height="32" rx="9" fill="currentColor"/><path d="M9 10.5h14v9H15l-5 4v-4H9v-9Z" stroke="white" stroke-width="1.5" stroke-linejoin="round"/></svg>
          <span>金融助手</span>
        </a>
        <div class="header-actions">
          <span id="service-status" class="service-status" role="status"><span class="status-dot"></span><span id="status-text">连接中</span></span>
          <button id="new-chat" class="plain-button" type="button"><span aria-hidden="true">＋</span> 新对话</button>
        </div>
      </header>

      <main id="conversation" class="conversation" aria-label="对话内容">
        <section id="welcome" class="welcome">
          <span class="eyebrow">你好</span>
          <h1>有什么需要帮忙的？</h1>
          <p>直接提问，或粘贴一段公告，<br class="mobile-break">提取企业收购、股份回购信息。</p>
          <div class="suggestions" aria-label="试一试">
            <button class="suggestion" type="button" data-example="chat">解释一下股份回购 <span aria-hidden="true">↗</span></button>
            <button class="suggestion" type="button" data-example="extract">试试公告抽取 <span aria-hidden="true">↗</span></button>
          </div>
        </section>
        <div id="messages" class="messages" role="log" aria-live="polite" aria-relevant="additions"></div>
      </main>

      <div class="composer-area">
        <p id="error" class="error" role="alert" hidden></p>
        <form id="chat-form" class="composer">
          <label class="sr-only" for="prompt">输入消息</label>
          <textarea id="prompt" name="message" rows="1" maxlength="12000" placeholder="输入问题或粘贴公告…" autocomplete="off"></textarea>
          <div class="composer-bottom">
            <span class="keyboard-hint">Enter 发送 · Shift + Enter 换行</span>
            <button id="send" class="send-button" type="submit" aria-label="发送消息" disabled><svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M10 15V5m0 0L5.5 9.5M10 5l4.5 4.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
          </div>
        </form>
        <p class="footnote">回答与抽取结果仅供参考，请以公告原文为准。</p>
      </div>
    </div>
  </body>
</html>
